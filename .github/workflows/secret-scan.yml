name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  trufflehog-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: truffleHog scan
        uses: step-security/trufflehog-action@v3
        with:
          # scan the repo for high-entropy strings and known secrets
          path: .
          format: json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
