name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
      - name: Run selected tests
        run: |
          pytest -q tests/test_sanitizer.py tests/test_verify_model_artifact.py
