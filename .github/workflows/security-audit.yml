name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly

jobs:
  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit against requirements.txt (if present)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          else
            echo "requirements.txt not found, skipping"
          fi
      - name: Run pip-audit against pyproject.toml (PEP 621)
        run: |
          if [ -f pyproject.toml ]; then
            python - <<'PY'
import tomllib,sys
p=tomllib.loads(open('pyproject.toml','rb').read())
deps=p.get('project',{}).get('dependencies',[])
open('._py_deps.txt','w').write('\n'.join(deps))
print('Wrote temporary dep file')
PY
            pip-audit -r ._py_deps.txt || true
          else
            echo "pyproject.toml not found, skipping"
          fi

  artifact-verify:
    name: Verify model artifacts
    runs-on: ubuntu-latest
    needs: pip-audit
    steps:
      - uses: actions/checkout@v4
      - name: Make verify script executable
        run: chmod +x scripts/verify_model_artifact.py || true
      - name: Find and verify artifacts with .sha256 files
        run: |
          set -e
          found=0
          for sha in $(git ls-files "**/*.sha256" || true); do
            found=1
            art=$(head -n1 "$sha" | awk '{print $2}');
            if [ -z "$art" ]; then
              # fallback: assume same basename without extension
              art="${sha%.sha256}"
            fi
            echo "Verifying $art with checksum $sha"
            python scripts/verify_model_artifact.py "$art" --sha256-file "$sha"
          done
          if [ "$found" -eq 0 ]; then
            echo "No .sha256 files found; skipping artifact verification"
          fi
        continue-on-error: true
